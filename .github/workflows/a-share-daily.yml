name: A股盘前全市场决策

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/a-share-daily.yml"
      - "automation/a-share-daily/main.py"
      - "automation/a-share-daily/runner.py"
      - "automation/a-share-daily/source_fallback.py"
      - "automation/a-share-daily/decision_rules.py"
      - "automation/a-share-daily/prompt.md"
      - "automation/a-share-daily/portfolio.json"
  schedule:
    # GitHub cron uses UTC. 00:25 UTC = 08:25 Asia/Shanghai.
    - cron: "25 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: a-share-daily-decision
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPORT_ASSIGNEE: schchit
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and push pre-market report
        run: python automation/a-share-daily/runner.py

      - name: Commit report archive
        run: |
          git config user.name "a-share-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/a-share-daily/latest.md automation/a-share-daily/reports/
          if git diff --cached --quiet; then
            echo "No report file changes to commit."
          else
            git commit -m "chore: publish A-share pre-market report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
